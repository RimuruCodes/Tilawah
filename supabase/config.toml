# Remote project configuration applied with `npx supabase config push`.
#
# IMPORTANT: `config push` writes CLI DEFAULTS for any field not listed
# here (verified: an early push tried to flip MFA settings we never asked
# about). Every managed field below is pinned, either to the value we want
# or to what the dashboard already had.
project_id = "hfmyyjotththoziatilb"

[auth]
# Where the sign-in email's links/redirects land: the app itself.
site_url = "https://tilawah1.com"
# Local dev + the old pages.dev URL (kept as a fallback during the domain
# migration) + the www variant stay allowed for auth flows.
additional_redirect_urls = ["http://localhost:5173", "https://www.tilawah1.com", "https://tilawah-7ox.pages.dev"]

[auth.mfa.totp]
# Pinned to the dashboard's existing values (config push would otherwise
# silently disable these).
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# Supabase's default email cap (30/hour, project-wide) is low enough that a
# small burst of legitimate sign-ins — or our own testing — trips a 429
# `over_email_send_rate_limit` and blocks real users. Raised to a value that
# still fits the Brevo free tier's 300/day. The other rate_limit fields are
# pinned to the CLI/dashboard defaults so `config push` doesn't silently
# change them (see the warning at the top of this file).
email_sent = 60
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# MUST stay false for the OTP-code flow. With confirmations ON, a brand-new
# email that signs up via signInWithOtp receives Supabase's *signup
# confirmation* email — the default LINK template, not the 6-digit code — so
# first-time subscribers would land on the "enter your code" screen with no
# code (verified empirically 2026-07-18). The OTP itself is the email
# verification here (verifyOtp), so a separate confirmation step is redundant
# and actively breaks new signups. Returning users were unaffected, which is
# why this hid during testing with an already-existing account.
enable_confirmations = false
max_frequency = "1m0s"
# 6-digit code (the app's UpgradeModal asks for exactly 6).
otp_length = 6
otp_expiry = 3600

# Custom SMTP via Brevo — required to (a) send auth email reliably and
# (b) unlock email-template customization (the free-tier built-in provider
# forbids both). Credentials verified against smtp-relay.brevo.com before
# this was pushed. The password is read from the environment (never stored
# in this committed file) — see the push command in the README.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "b1ca38001@smtp-brevo.com"
pass = "env(SMTP_PASSWORD)"
admin_email = "no-reply@tilawah1.com"
sender_name = "Tilawah"

# signInWithOtp sends the "magic link" template; with SMTP enabled we can
# now replace it with the 6-digit code email (supabase/templates/magic_link.html
# contains {{ .Token }}, no link).
[auth.email.template.magic_link]
subject = "Your Tilawah sign-in code"
content_path = "./supabase/templates/magic_link.html"
