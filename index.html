<!doctype html>
<!-- translate="no": the page mixes English UI with substantial intentional
     Arabic (Quran text), which trips Chrome's language-detection heuristic
     into offering to auto-translate — wrong and confusing for scripture
     that must never be machine-translated. The meta below covers Google
     Translate specifically; the attribute covers the HTML translate spec. -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quran Companion — Read, Listen, Memorize</title>
    <meta name="description" content="Read, listen to, and memorize the Quran, with recitation practice scored by real acoustic analysis and speech recognition — installable, works offline after first use." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
